<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Source of apple-touch-icon.png / icon-192.png / icon-512.png: the logo
       full-bleed (iOS rounds the corners itself, transparent corners turn black).
       Regenerate: rsvg-convert -w 180 -h 180 touch-icon.svg -o apple-touch-icon.png
       (and -w/-h 192, 512 for icon-192.png, icon-512.png) -->
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4f8cff"/><stop offset="1" stop-color="#7b6cff"/></linearGradient></defs>
  <rect width="64" height="64" fill="#0e141d"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14" fill="none" stroke="url(#g)" stroke-width="3" opacity=".55"/>
  <path d="M32 13.5C26 21.5 20 28.5 20 36.5a12 12 0 0 0 24 0C44 28.5 38 21.5 32 13.5Z"
        fill="#0e141d" stroke="#0bb4a6" stroke-width="4" stroke-linejoin="round"/>
  <polyline points="25,39 29.5,35 33.5,38 39,32" fill="none" stroke="#7b6cff"
            stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="39" cy="32" r="2.2" fill="#4f8cff"/>
</svg>
